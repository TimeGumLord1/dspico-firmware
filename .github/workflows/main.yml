name: Build DSpico Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Raspberry Pi Pico SDK Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

    - name: Set up Pico SDK
      run: |
        git clone --depth 1 --branch master https://github.com
        cd pico-sdk
        git submodule update --init
        echo "PICO_SDK_PATH=$PWD" >> $GITHUB_ENV

    - name: Configure CMake and Build
      run: |
        mkdir build
        cd build
        cmake ..
        make -j$(nproc)

    - name: Upload Firmware Artifact
      uses: actions/artifacts/upload-artifact@v4
      with:
        name: dspico-no-autoboot
        path: build/*.uf2
