name: Build DSpico Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Build Tools and Pi Pico SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential pico-sdk

    - name: Configure CMake and Build
      run: |
        mkdir build
        cd build
        cmake -DPICO_SDK_PATH=/usr/share/pico-sdk ..
        make -j$(nproc)

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dspico-no-autoboot
        path: build/*.uf2
